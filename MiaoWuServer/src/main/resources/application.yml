#application.yml
server:
  port: 8088
# Elasticsearch REST endpoint used by ElasticSearchConfig (HTTP port, not the 9300 transport port)
miaowu:
  elasticsearch:
    host: ${ES_HOST:localhost}
    port: ${ES_PORT:9200}
    scheme: ${ES_SCHEME:http}
spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/miaowu?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:miaowu}
    password: ${DB_PASSWORD:changeme}
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:changeme}
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 1000s  # connection timeout; in 2.0 this is a Duration, so the unit is required
    # pool settings; in 2.0 the pool is configured via jedis or lettuce
    jedis:
      pool:
        # max idle connections
        max-idle: 500
        # min idle connections
        min-idle: 50
        # max wait for a connection, negative means unlimited
        max-wait: -1
        # max active connections, negative means unlimited
        max-active: -1
  cache:
      redis:
        time-to-live: -1 # milliseconds
  rabbitmq:
      host: 127.0.0.1
      port: 5672
      username: ${RABBITMQ_USERNAME:guest}
      password: ${RABBITMQ_PASSWORD:changeme}
mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
logging:
  config: classpath:log4j2.yml